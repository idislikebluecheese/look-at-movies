function ofs() {
 var elem = document.querySelector('#frame')
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) { 
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
}
async function info(){
  const urll = `https://api.themoviedb.org/3/movie/${url.searchParams.get("id")}?api_key=d93115754010beb32ae8956c26dbc590`
  try{
    const res = await fetch(urll)
    const json = await res.json()
        if(res.status === 404){window.alert("Invalid TMDB id"); window.location.href = `https://${url.hostname}/look-at-movies`}
    document.title = `FreeStreamer 🎬 - ${json.title}`
    if(!res.ok){throw new Error(`code ${res.status}`)}
    document.querySelector('#infop').innerHTML = `<h1>${json.original_title}</h1>
<p><strong>Release Date:</strong> ${json.release_date}</p>
<p><strong>Homepage:</strong> <a href="${json.homepage}" target="_blank">${json.homepage}</a></p>
<p><strong>Vote Count:</strong> ${json.vote_count}</p>
<p><strong>ID:</strong> ${json.id}</p>
<p><strong>IMDb:</strong> <a href="https://imdb.com/title/${json.imdb_id}" target="_blank">View on IMDb</a></p>
<p><strong>IMDb ID:</strong> ${json.imdb_id}</p>
<p><strong>Poster:</strong> <a href="https://image.tmdb.org/t/p/w500/${json.poster_path}" target="_blank">Poster Path</a></p>
<p><strong>Backdrop:</strong> <a href="https://image.tmdb.org/t/p/w500/${json.backdrop_path}" target="_blank">Backdrop Path</a></p>
<p><strong>Vote Average:</strong> ${json.vote_average}</p>
<p><strong>Runtime:</strong> ${json.runtime} minutes</p>
<p><strong>Popularity:</strong> ${json.popularity}</p>
<p><strong>Status:</strong> ${json.status}</p>
<p><strong>Overview:</strong> ${json.overview}</p>`
  }
  catch(er){
    console.error(er.message)
  }
}
